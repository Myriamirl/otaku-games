<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vue Hokage — Otaku Games</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="admin">

<div class="shell">
  <header class="top-bar">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="17" stroke="#e2601f" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="88 20"/>
      </svg>
      <span class="brand-name">Otaku Games</span>
    </a>
    <span class="pill pill-accent">Vue Hokage — lecture seule pour les joueurs</span>
  </header>

  <main style="margin:36px 0 80px;">

    <div class="two-col" style="grid-template-columns:2fr 1fr;align-items:start;margin-bottom:24px">

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Partie en cours</h2>
          <span class="pill" id="room-code-pill">Code K3NJA9</span>
        </div>

        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Joueur</th>
                <th>Rôle</th>
                <th>Mot</th>
                <th>Statut</th>
                <th>Tour</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="stack">
        <div class="panel">
          <div class="panel-header"><h2 class="panel-title">État</h2></div>
          <div class="stack" style="gap:12px">
            <div style="display:flex;justify-content:space-between"><span>Manche</span><span class="pill" id="state-round">1 / 3</span></div>
            <div style="display:flex;justify-content:space-between"><span>Mode</span><span class="pill" id="state-mode">Original</span></div>
            <div style="display:flex;justify-content:space-between"><span>Phase</span><span class="pill pill-accent" id="state-phase">Indices</span></div>
            <div style="display:flex;justify-content:space-between"><span>Joueurs vivants</span><span class="pill" id="state-alive">4 / 5</span></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2 class="panel-title">Contrôles</h2></div>
          <div class="stack" style="gap:10px">
            <button type="button" class="btn btn-outline btn-block" id="btn-start-clues">Lancer les indices</button>
            <button type="button" class="btn btn-outline btn-block" id="btn-start-vote">Lancer le vote</button>
            <button type="button" class="btn btn-outline btn-block" id="btn-next-round">Manche suivante</button>
            <button type="button" class="btn btn-danger btn-block" id="btn-end-game">Terminer la partie</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2 class="panel-title">Mots de la manche</h2></div>
      <div class="two-col">
        <div>
          <p class="field-hint">Mot des ninjas</p>
          <p class="word-reveal" style="font-size:1.3rem" id="word-civil">Ramen</p>
        </div>
        <div>
          <p class="field-hint">Mot de l'espion</p>
          <p class="word-reveal" style="font-size:1.3rem" id="word-impostor">Dango</p>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/pages/admin.js"></script>
</body>
</html>
