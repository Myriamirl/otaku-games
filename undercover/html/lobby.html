<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salon d'attente — Otaku Games</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="lobby">

<div class="shell">
  <header class="top-bar">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="17" stroke="#e2601f" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="88 20"/>
      </svg>
      <span class="brand-name">Otaku Games</span>
    </a>
    <button type="button" class="btn btn-danger btn-sm" id="leave-btn">Quitter</button>
  </header>

  <main style="max-width:640px;margin:48px auto 80px;">

    <div class="panel" style="text-align:center;margin-bottom:24px">
      <p style="font-size:0.85rem;margin-bottom:8px">Code de la partie — à partager avec tes amis</p>
      <div style="font-family:var(--font-mono);font-size:2.2rem;letter-spacing:0.2em;color:var(--accent)" id="room-code-display">------</div>
      <button type="button" class="btn btn-outline btn-sm" id="copy-code-btn" style="margin-top:14px">Copier le code</button>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Joueurs dans le salon</h2>
        <span class="pill" id="player-count-pill">0 / 6</span>
      </div>

      <div id="player-list"></div>

      <p class="field-hint" style="margin-top:16px" id="waiting-hint">En attente d'autres joueurs…</p>
    </div>

    <div style="margin-top:24px" id="host-controls">
      <button type="button" class="btn btn-primary btn-block" id="start-btn" disabled>
        Lancer la partie (3 joueurs minimum)
      </button>
    </div>

  </main>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/pages/lobby.js"></script>
</body>
</html>
